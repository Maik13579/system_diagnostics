system_diagnostics:
  ros__parameters:
    update_rate: 1.0
    hardware_id: "host_pc"
    tasks: ["cpu", "memory", "docker_memory", "storage", "thermal", "network", "time_sync", "battery"]

    cpu:
      plugin: "system_diagnostics/CpuTask"
      enabled: true
      name: "system_diagnostics/cpu"
      warn_usage: 80.0
      error_usage: 95.0
      warn_load_per_core: 1.0
      error_load_per_core: 1.5
      proc_path: "/proc"

    memory:
      plugin: "system_diagnostics/MemoryTask"
      enabled: true
      name: "system_diagnostics/memory"
      warn_usage: 85.0
      error_usage: 95.0
      warn_swap_usage: 20.0
      error_swap_usage: 50.0
      proc_path: "/proc"

    docker_memory:
      plugin: "system_diagnostics/DockerMemoryTask"
      enabled: false
      name: "system_diagnostics/docker_memory"
      socket_path: "/var/run/docker.sock"
      background: true
      warn_usage: 80.0
      error_usage: 90.0
      warn_usage_bytes: 0
      error_usage_bytes: 0

    storage:
      plugin: "system_diagnostics/StorageTask"
      enabled: true
      name: "system_diagnostics/storage"
      paths:
        - "/"
      warn_usage: 85.0
      error_usage: 95.0
      check_writable: false

    thermal:
      plugin: "system_diagnostics/ThermalTask"
      enabled: true
      name: "system_diagnostics/thermal"
      sysfs_path: "/sys/class/thermal"
      warn_temperature_c: 75.0
      error_temperature_c: 90.0

    network:
      plugin: "system_diagnostics/NetworkTask"
      enabled: true
      name: "system_diagnostics/network"
      sysfs_path: "/sys/class/net"
      interfaces:
        - "eth0"
      require_carrier: true
      warn_rx_errors_delta: 1
      error_rx_errors_delta: 10
      warn_tx_errors_delta: 1
      error_tx_errors_delta: 10
      warn_rx_dropped_delta: 1
      error_rx_dropped_delta: 10
      warn_tx_dropped_delta: 1
      error_tx_dropped_delta: 10

    time_sync:
      plugin: "system_diagnostics/TimeSyncTask"
      enabled: true
      name: "system_diagnostics/time_sync"
      require_synchronized: true
      warn_offset_ms: 50.0
      error_offset_ms: 100.0
      warn_max_error_ms: 1000.0
      error_max_error_ms: 5000.0

    battery:
      plugin: "system_diagnostics/BatteryTask"
      enabled: false
      name: "system_diagnostics/battery"
      power_supply_path: "/sys/class/power_supply"
      supplies:
        - "BAT0"
      warn_capacity: 30.0
      error_capacity: 15.0
      require_present: true
